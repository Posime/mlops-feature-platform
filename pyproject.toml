[project]
name = "mlops-feature-platform"
version = "0.1.0"
description = "MLOps Feature Platform"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "evidently>=0.7.23",
    "fastapi>=0.141.1",
    "feast>=0.65.0",
    "gunicorn>=26.0.0",
    "locust>=2.46.5",
    "mlflow>=3.15.1",
    "onnx>=1.22.0",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.28.0",
    "pandas>=2.3.3",
    "pandera>=0.32.1",
    "prometheus-client>=0.24.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "skl2onnx>=1.20.0",
    "uvicorn[standard]>=0.34.0",
    "xgboost>=3.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "locust>=2.46.5",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 99
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "mlruns",
    "mlflow_artifacts",
    "reports",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []


[tool.ruff.lint.per-file-ignores]
"src/features/materialize.py" = ["E402"]
