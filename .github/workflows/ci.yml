name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quality:
    name: Lint & Code Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Linting Tools
        run: uv sync --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Verify Code Formatting
        run: uv run ruff format --check .

  
  test:
    name: Schema & Serving Test Suite
    runs-on: ubuntu-latest
    needs: quality
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Project Dependencies
        run: uv sync --all-extras

      - name: Run Test Suite via PyTest
        env:
          REDIS_CONNECTION_STRING: localhost:6379
          FEAST_REPO_PATH: src/features
          MODEL_PATH: models/model.onnx
        run: uv run pytest tests/ -v

  
  docker-smoke-build:
    name: Build Serving Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Serving Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.serving
          push: false
          tags: mlops-serving:ci-test