services:
  # -----------------------------------------------------------------
  # 1. Redis: In-Memory Online Feature Store
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mlops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -----------------------------------------------------------------
  # 2. MLflow: SQLite-Backed Experiment Tracking & Registry
  # -----------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: mlops_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./models:/models
    entrypoint:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlruns/mlflow.db
      - --default-artifact-root
      - /mlruns
    restart: unless-stopped

  # -----------------------------------------------------------------
  # 3. Serving Engine: FastAPI Real-Time Inference
  # -----------------------------------------------------------------
  serving:
    build:
      context: .
      dockerfile: Dockerfile.serving
    image: credit-serving:latest
    container_name: mlops_serving
    ports:
      - "8000:8000"
    environment:
      - FEAST_REPO_PATH=/app/src/features
      - MODEL_PATH=/app/models/model.onnx
      - REDIS_CONNECTION_STRING=redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - WEB_CONCURRENCY=4
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    volumes:
      - ./src/features:/app/src/features
      - ./src/serving:/app/src/serving
      - ./models:/app/models
      - ./data/inference_logs:/app/data/inference_logs
    networks:
      - mlops-network  
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # -----------------------------------------------------------------
  # 4. Prometheus: Metrics Telemetry & Scraper
  # -----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mlops_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mlops-network
    depends_on:
      - serving
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mlops_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mlops-network
    depends_on:
      - prometheus

networks:
  mlops-network:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data: