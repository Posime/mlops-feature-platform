stages:
  ingest:
    cmd: uv run python src/data/ingest.py
    deps:
      - src/data/ingest.py
    params:
      - ingest.num_records
      - ingest.random_seed
      - ingest.user_id_min
      - ingest.user_id_max
    outs:
      - data/raw/credit_transactions.parquet

  materialize_features:
    cmd: uv run python src/features/materialize.py
    deps:
      - data/raw/credit_transactions.parquet
      - src/features/feature_store.yaml
      - src/features/schema.py
      - src/features/materialize.py

  build_training_features:
    cmd: uv run python src/features/build_training_data.py
    deps:
      - data/raw/credit_transactions.parquet
      - src/features/schema.py
      - src/features/build_training_data.py
    params:
      - features.lookback_days
    outs:
      - data/processed/train_features.parquet

  validate_data:
    cmd: uv run pytest tests/test_data_quality.py
    deps:
      - data/processed/train_features.parquet
      - src/features/data_validation.py
      - tests/test_data_quality.py

  train:
    cmd: uv run python src/models/train.py
    deps:
      - data/processed/train_features.parquet
      - src/models/train.py
    params:
      - train.test_size
      - train.random_state
      - train.n_estimators
      - train.learning_rate
      - train.max_depth
      - train.subsample
      - train.scale_pos_weight
    outs:
      - models/model.json
    metrics:
      - reports/metrics.json:
          cache: false

  export_onnx:
    cmd: uv run python src/models/export_onnx.py
    deps:
      - models/model.json
      - src/models/export_onnx.py
    outs:
      - models/model.onnx

  register_model:
    cmd: uv run python src/models/register_model.py
    deps:
      - reports/metrics.json
      - src/models/register_model.py
